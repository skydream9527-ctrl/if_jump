<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>If Jump 🐍🕹️ — Web 逻辑跳跃与 Python 可视化游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-panel: #151c2c;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --text-main: #f8fafc;
      --border-color: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
      padding: 16px 28px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-size: 18px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }

    .game-area {
      flex: 1; display: flex; gap: 24px; max-width: 1200px; width: 100%; margin: 24px auto; padding: 0 24px;
    }
    .canvas-container {
      flex: 1; background: #000; border: 2px solid var(--accent); border-radius: 16px;
      overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 40px var(--accent-glow);
    }
    canvas { background: #0b0f19; }

    .control-panel {
      width: 360px; background: var(--bg-panel); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .stat-box { background: rgba(255, 255, 255, 0.05); padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
    .btn-action {
      background: var(--accent); color: #0f172a; border: none; font-weight: 800; padding: 12px;
      border-radius: 8px; cursor: pointer; font-size: 15px; width: 100%; transition: all 0.2s ease;
    }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🐍 If Jump (吃了么)</span>
    </div>
    <div style="font-size:13px; color:var(--accent);">Web Canvas & Python Condition Engine</div>
  </header>

  <div class="game-area">
    <div class="canvas-container">
      <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <div class="control-panel">
      <div>
        <h3 style="font-size:18px; font-weight:800; margin-bottom:12px; color:var(--accent);">🎮 游戏控制与数值</h3>
        <div class="stat-box">得分: <strong id="scoreVal" style="color:var(--accent); font-size:18px;">0</strong></div>
        <div class="stat-box">最大连跳: <strong id="highVal">0</strong></div>
        <div class="stat-box" style="line-height:1.6;">
          <strong>操作说明:</strong><br>
          • 按 <code>Space</code> / <code>↑</code> 或点击“跳跃”按键让角色跳跃。<br>
          • 落在平台中央获取高分。
        </div>
      </div>

      <button class="btn-action" onclick="playerJump()">🚀 触发跳跃 (JUMP)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let score = 0;
    let highScore = 0;
    
    const player = {
      x: 100,
      y: 300,
      vy: 0,
      gravity: 0.6,
      jumpPower: -12,
      grounded: true,
      size: 24
    };

    const platforms = [
      { x: 50, y: 330, w: 120, h: 20 },
      { x: 220, y: 280, w: 100, h: 20 },
      { x: 380, y: 230, w: 100, h: 20 },
      { x: 520, y: 180, w: 100, h: 20 }
    ];

    function playerJump() {
      if (player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
        score += 10;
        if (score > highScore) highScore = score;
        document.getElementById('scoreVal').innerText = score;
        document.getElementById('highVal').innerText = highScore;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        playerJump();
      }
    });

    function update() {
      player.vy += player.gravity;
      player.y += player.vy;

      player.grounded = false;
      platforms.forEach(p => {
        if (player.x + player.size > p.x && player.x < p.x + p.w &&
            player.y + player.size >= p.y && player.y + player.size <= p.y + p.h + player.vy) {
          player.y = p.y - player.size;
          player.vy = 0;
          player.grounded = true;
        }
      });

      if (player.y > canvas.height) {
        player.x = 100;
        player.y = 300;
        player.vy = 0;
        score = 0;
        document.getElementById('scoreVal').innerText = score;
      }

      platforms.forEach(p => {
        p.x -= 1;
        if (p.x + p.w < 0) {
          p.x = canvas.width;
          p.y = 150 + Math.random() * 180;
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw platforms
      ctx.fillStyle = '#10b981';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
      });

      // Draw player
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y, player.size, player.size);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
